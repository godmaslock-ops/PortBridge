[package]
name = "portbridge-common"
version = "0.14.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time", "macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
